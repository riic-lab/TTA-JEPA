# Feature dimensions come from the dataset schema; paths are CLI inputs.
cpu_threads: 8
model:
  student:
    width: 512
    n_layers: 3
    n_heads: 8
    n_kv_heads: 8
    horizon: 48
    max_positions: 8192
  teacher:
    width: 256
    n_heads: 4
    horizon: 48
  tte_head:
    hidden_dim: 512
    n_frequencies: 8
    identity_dim: 16
  ema_momentum: 0.996
downstream:
  hidden_dim: 256
  dropout: 0.0
  horizons:
    circulatory_failure: 8
    respiratory_failure: 24
    kidney_failure: 48
    liver_failure: 48
    hyperglycemia: 8
    sepsis3: 8
    decompensation: 24
pretraining:
  epochs: 100
  batch_size: 8
  effective_batch_size: 512
  max_batch_tokens: 16384
  anchors_per_admission: 16
  min_context_hours: 6
  validation_draws: 3
  temporal_mask_rate: 0.25
  feature_mask_rate: 0.15
  target_feature_dropout: 0.25
  lr: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_fraction: 0.05
  grad_clip: 1.0
  val_interval: 5
  selection_start_epoch: 10
  patience: 3
  factor: 0.6666666666666666
  min_lr_scale: 0.02
  stop_after_reductions: 3
finetuning:
  precision: bfloat16
  epochs: 100
  min_context_hours: 4
  anchor_chunk_size: 32
  batch_rows: 16384
  predict_batch_rows: 32768
  lr: 0.005
  weight_decay: 0.1
  grad_clip: 1.0
  val_interval: 5
  patience: 2
  factor: 0.6666666666666666
  min_lr_scale: 0.02
  stop_after_reductions: 3
