extends: tte_jepa.yaml
method: xgboost
model: {}
xgboost:
  objective: binary:logistic
  eval_metric: auc
  tree_method: hist
  max_bin: 256
  max_depth: 6
  eta: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5.0
  lambda: 1.0
  num_boost_round: 400
  early_stopping_rounds: 25
  chunk_rows: 8192
